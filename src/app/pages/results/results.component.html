<div *ngIf="isLoading" class="flex justify-center items-center h-screen">
  <img
    src="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.reddit.com%2Fr%2Fzflipcoverscreengifs%2Fcomments%2F1gos4zy%2Fanime_gif_collection%2F%3Ftl%3Dpt-br&psig=AOvVaw3VfMq3RWXkSdYYOL5J166w&ust=1746753269198000&source=images&cd=vfe&opi=89978449&ved=0CBMQjRxqFwoTCOizmpPZko0DFQAAAAAdAAAAABAE"
    alt="Carregando..." />
</div>
<section class="bg-slate-950 p-8 rounded-md text-white h-full">
  <div style="padding: 30px" *ngIf="!isLoading && results">
    <a href="">Retornar a página inicial</a>
    <div class="flex justify-center items-center" style="margin-bottom: 20px">
      <h2>Resultados:</h2>
    </div>

    <div class="flex flex-wrap gap-4 justify-center items-center">
      <div *ngFor="let result of results" class="shadow-xl p-8 bg-violet-500 dark:bg-gray-800 rounded-lg max-w-sm"
        style="padding: 10px" (mouseenter)="playVideo(result.filename)" (mouseleave)="pauseVideo(result.filename)">
        <!-- ...existing code... -->
        <div>
          <div class="flex justify-center">
            <video [id]="'video-' + result.filename" [src]="result.video" muted loop style="display: block;"></video>
          </div>

          <div class="px-5 pb-5">
            <a href="#">
              <h5 class="text-xl font-semibold tracking-tight text-white">
                Nome: {{ result.filename }}
              </h5>

              <h5 class="text-xl font-semibold tracking-tight text-white">
                Episódio: {{ result.episode }}
              </h5>
            </a>
            <div class="flex items-center mt-2.5 mb-5">
              <div *ngIf="result.similarity >= 0.20 else lowSimilarity"
                class="flex items-center space-x-1 rtl:space-x-reverse">
                Tenho: {{ (result.similarity * 100) | number : "1.0-0" }}% de certeza que é esse o anime que você
                procura!
              </div>

              <ng-template #lowSimilarity>
                <div>
                  Humm... Provavelmente não é isso que você procura...
                </div>
              </ng-template>

            </div>
          </div>
        </div>
      </div>


    </div>
  </div>

  <div class="flex justify-center items-center search-container" *ngIf="!isLoading && !results">
    <h1 class="text-2xl font-bold text-white">Estamos procurando...</h1>
    <img src="../../assets/imgs/" alt="" />
  </div>
</section>
